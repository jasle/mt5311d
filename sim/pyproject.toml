[project]
name = "mt5311sim"
version = "0.1.0"
description = "Simulator for the EBM monitoring protocol of Metanoia MT5311 VDSL2 SFP modems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.poetry]
packages = [{ include = "mt5311sim" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "netns: needs a network namespace with a veth pair (task sim:test-netns)",
]
