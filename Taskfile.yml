version: '3'

tasks:
  install:
    desc: Install the test dependencies, including the simulator
    cmds:
      - poetry install

  test:
    desc: Run the tests of the ucode modules
    cmds:
      - poetry run pytest -m "not netns" {{.CLI_ARGS}}

  sim:install:
    desc: Install the simulator and its test dependencies
    dir: sim
    cmds:
      - poetry install

  sim:test:
    desc: Run the simulator tests that need no network namespace
    dir: sim
    cmds:
      - poetry run pytest -m "not netns" {{.CLI_ARGS}}

  sim:test-netns:
    desc: Run all simulator tests, including those over veth interfaces in a network namespace
    dir: sim
    cmds:
      - unshare --map-root-user --net env MT5311SIM_NETNS=1 poetry run pytest {{.CLI_ARGS}}

  sim:run:
    desc: Run the simulator on an interface (needs CAP_NET_RAW), e.g. task sim:run -- -i veth1
    dir: sim
    cmds:
      - poetry run mt5311sim {{.CLI_ARGS}}
