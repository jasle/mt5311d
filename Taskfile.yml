version: '3'

tasks:
  install:
    desc: Install the test dependencies, including the simulator
    cmds:
      - poetry install

  test:
    desc: Run the tests of the ucode code in the OpenWrt test container
    cmds:
      - task: pytest
        vars: { ARGS: '{{.CLI_ARGS}}' }

  check:
    desc: Check all ucode sources for syntax errors
    cmds:
      - task: pytest
        vars: { ARGS: 'tests/test_syntax.py {{.CLI_ARGS}}' }

  pytest:
    internal: true
    # pytest runs in podman's user namespace, where it may enter the network
    # namespace of the test container.
    env:
      DOCKER_HOST: unix://{{.XDG_RUNTIME_DIR}}/podman/podman.sock
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    vars:
      XDG_RUNTIME_DIR: { sh: 'echo "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"' }
    cmds:
      - podman unshare poetry run pytest {{.ARGS}}

  sim:install:
    desc: Install the simulator and its test dependencies
    dir: sim
    cmds:
      - poetry install

  sim:test:
    desc: Run the simulator tests that need no network namespace
    dir: sim
    cmds:
      - poetry run pytest -m "not netns" {{.CLI_ARGS}}

  sim:test-netns:
    desc: Run all simulator tests, including those over veth interfaces in a network namespace
    dir: sim
    cmds:
      - unshare --map-root-user --net env MT5311SIM_NETNS=1 poetry run pytest {{.CLI_ARGS}}

  sim:run:
    desc: Run the simulator on an interface (needs CAP_NET_RAW), e.g. task sim:run -- -i veth1
    dir: sim
    cmds:
      - poetry run mt5311sim {{.CLI_ARGS}}
